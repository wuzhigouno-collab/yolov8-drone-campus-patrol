# 鹰眼巡校——A10 系统集成与多高度测试 评估配置
#
# 素材来源（如实说明）：
#   现有测试素材仅两段，均来自农场防护项目（C:/Users/OS/Desktop/farm_guard/videos/）：
#     1. farm_guard.mp4      50 帧，1920x1080，30fps——无人机航拍稻田劳作人群；
#     2. 5G智慧农业素材.mp4  3712 帧，1920x1080，25fps——智慧农业宣传素材，
#        内容为 CG 片头 + 收割机高空俯拍 + 温室棚内近景 + 农田高空俯拍人群的混合剪辑。
#   两段素材均无人工标注真值，评估采用 tools/evaluate.py 模块 docstring
#   定义的代理口径（轨迹确认率 / 疑似误检占比 / 轨迹缺口率）。
#
# 归挡依据（按实际画面高度感估算，公式：距离 ≈ 等效焦距f(px) × 目标实际高度 / 目标像素高度，
#           1080p 画面、水平视场角按常见无人机约 60° 估 f≈935px）：
#   - farm_guard.mp4：弯腰劳作人（实际高约 1.1m）在画面中约 100~120px，
#     估算拍摄高度约 9~10m，归入 10 米档；
#   - 5G智慧农业素材.mp4：收割机俯拍段（机身实际高约 4m，约 200px）估算约 19m，
#     结尾农田人群俯拍段（人约 40~50px）估算 30m 以上；棚内段为地面近景机位。
#     素材主体为高空俯拍段落，归入 15 米档并注明其为混合素材，
#     该档指标反映的是"混合内容整体表现"，不代表纯 15m 定高巡航画面；
#   - 5 米档：两段素材均无低空（约 5m）定高航拍画面，暂无素材，如实留空待补测。

# 评估用模型权重（相对项目根目录；命令行 --weights 可覆盖，用于模型对比）
weights: weights/yolov8n.pt
# 评估结果 JSON 落盘路径（相对项目根目录；命令行 --out 可覆盖）
out: tests/a10_eval.json

groups:
  - height_m: 5
    note: 暂无素材（现有两段素材均无约 5m 低空定高航拍画面，待补测）
    videos: []

  - height_m: 10
    note: >-
      farm_guard.mp4：稻田劳作人群航拍，弯腰人约 100~120px 高，
      按人实际高约 1.1m 估算拍摄高度约 9~10m，归入本档
    videos:
      - path: C:/Users/OS/Desktop/farm_guard/videos/farm_guard.mp4
        max_frames: 50          # 素材全长仅 50 帧，全量评估
        gt_file: null           # 无人工标注真值，走代理口径

  - height_m: 15
    note: >-
      5G智慧农业素材.mp4：混合剪辑素材（CG 片头/收割机俯拍/棚内近景/
      农田人群高空俯拍），航拍主体段落估算高度 19~30m+，按主体归入本档；
      指标为该混合素材整体表现，不代表纯 15m 定高画面
    videos:
      - path: C:/Users/OS/Desktop/farm_guard/videos/5G智慧农业素材.mp4
        max_frames: 3712        # 素材全长 3712 帧，全量评估
        gt_file: null           # 无人工标注真值，走代理口径
